<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tests</title>
</head>
<body>
  <h1>Regex tests</h1>
  <ul id="results"></ul>
 
  <script type="module">
    import { isValidDescription, isValidAmount, isValidDate, isValidCategory, hasDuplicateWord } from './scripts/validators.js';
 
    const list = document.getElementById('results');
 
    function test(name, passed) {
      const icon = passed ? 'O' : 'X';
      list.innerHTML += '<li>' + icon + ' ' + name + '</li>';
    }
 
    test('description accepts "Lunch"', isValidDescription('Lunch') === true);
    test('description rejects leading space', isValidDescription(' Lunch') === false);
    test('amount accepts 12.50', isValidAmount('12.50') === true);
    test('amount rejects 012', isValidAmount('012') === false);
    test('amount rejects 1.234', isValidAmount('1.234') === false);
    test('date accepts 2025-09-29', isValidDate('2025-09-29') === true);
    test('date rejects 2025-13-01', isValidDate('2025-13-01') === false);
    test('category accepts "Fast-food"', isValidCategory('Fast-food') === true);
    test('category rejects "Food1"', isValidCategory('Food1') === false);
    test('finds duplicate word', hasDuplicateWord('the the cafe') === true);
    test('no duplicate word', hasDuplicateWord('the cafe') === false);
  </script>
</body>
</html>
